# Publica a API no mesmo Cloud Run a cada PR para main.
# Build: Cloud Build (`--source .`), nunca docker build no runner.
# Não envia --set-env-vars / --set-secrets para preservar LLM e chaves já montadas.

name: Deploy Cloud Run

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  PROJECT_ID: imec-analysis
  REGION: us-central1
  SERVICE: imec-analysis-api
  SERVICE_URL: https://imec-analysis-api-800201627986.us-central1.run.app
  WIF_PROVIDER: projects/800201627986/locations/global/workloadIdentityPools/github/providers/github
  WIF_SERVICE_ACCOUNT: github-deploy@imec-analysis.iam.gserviceaccount.com

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

  deploy:
    name: Cloud Run (build in cloud)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy source to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --quiet

      - name: Comment service URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.SERVICE_URL;
            const body = [
              'Deploy Cloud Run (build in cloud) disparado por este PR.',
              '',
              `- Serviço: \`${process.env.SERVICE}\``,
              `- URL: ${url}`,
              `- Swagger: ${url}/docs`,
              `- Health: ${url}/health`,
              '',
              'Este PR **substitui** o serviço experimental compartilhado (não há preview isolado).',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
